<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Hello World</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { overflow: hidden; background: #fff; touch-action: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 1000);
camera.position.set(0, 0, 8);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0xffffff);
document.body.appendChild(renderer.domElement);

// Lights
const light1 = new THREE.DirectionalLight(0xff6644, 1.2);
light1.position.set(3, 4, 5);
scene.add(light1);

const light2 = new THREE.DirectionalLight(0x4488ff, 0.8);
light2.position.set(-3, -2, 3);
scene.add(light2);

scene.add(new THREE.AmbientLight(0x222233, 0.5));

// Build 3D text from box geometries
const text = "HELLO WORLD";
const glyphs = {
  H: [[0,0],[0,1],[0,2],[0,3],[0,4],[1,2],[2,0],[2,1],[2,2],[2,3],[2,4]],
  E: [[0,0],[0,1],[0,2],[0,3],[0,4],[1,0],[1,2],[1,4],[2,0],[2,4]],
  L: [[0,0],[0,1],[0,2],[0,3],[0,4],[1,0],[2,0]],
  O: [[0,0],[0,1],[0,2],[0,3],[0,4],[1,0],[1,4],[2,0],[2,1],[2,2],[2,3],[2,4]],
  W: [[0,0],[0,1],[0,2],[0,3],[0,4],[1,1],[2,2],[3,1],[4,0],[4,1],[4,2],[4,3],[4,4]],
  R: [[0,0],[0,1],[0,2],[0,3],[0,4],[1,2],[1,4],[2,2],[2,3],[2,4],[1,1]],
  D: [[0,0],[0,1],[0,2],[0,3],[0,4],[1,0],[1,4],[2,1],[2,2],[2,3]],
  ' ': []
};

function getCharWidth(ch) {
  const g = glyphs[ch];
  if (!g || g.length === 0) return 2;
  return Math.max(...g.map(p => p[0])) + 1;
}

const blockSize = 0.38;
const gap = 0.15;
const charGap = 0.5;

// Calculate total width
let totalWidth = 0;
for (let i = 0; i < text.length; i++) {
  totalWidth += getCharWidth(text[i]) * (blockSize + gap);
  if (i < text.length - 1) totalWidth += charGap;
}

const group = new THREE.Group();
let cursorX = -totalWidth / 2;

const colors = [0xff4444, 0xff6633, 0xffaa22, 0xffdd00, 0x66ff44, 0x22ddff, 0x4488ff, 0x6644ff, 0xaa22ff, 0xff22cc, 0xff4466];

for (let ci = 0; ci < text.length; ci++) {
  const ch = text[ci];
  const g = glyphs[ch];
  if (!g) { cursorX += 2 * (blockSize + gap) + charGap; continue; }

  const color = new THREE.Color(colors[ci % colors.length]);
  const mat = new THREE.MeshStandardMaterial({
    color: color,
    roughness: 0.3,
    metalness: 0.6,
  });

  for (const [x, y] of g) {
    const geo = new THREE.BoxGeometry(blockSize, blockSize, blockSize * 1.8);
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(
      cursorX + x * (blockSize + gap),
      (y - 2) * (blockSize + gap),
      0
    );
    mesh.userData = { baseY: mesh.position.y, charIndex: ci, delay: ci * 0.15 + x * 0.05 + y * 0.03 };
    group.add(mesh);
  }
  cursorX += getCharWidth(ch) * (blockSize + gap) + charGap;
}

scene.add(group);

// Fit to screen
const isMobile = innerWidth < 768;
camera.position.z = isMobile ? 14 : 10;

// Touch / mouse rotation + pinch zoom
let targetRotX = 0, targetRotY = 0;
let isDragging = false, lastX = 0, lastY = 0;
const minZ = 4, maxZ = 28;
let targetZ = isMobile ? 14 : 10;

function onStart(x, y) { isDragging = true; lastX = x; lastY = y; }
function onMove(x, y) {
  if (!isDragging) return;
  targetRotY += (x - lastX) * 0.005;
  targetRotX += (y - lastY) * 0.005;
  targetRotX = Math.max(-0.8, Math.min(0.8, targetRotX));
  lastX = x; lastY = y;
}
function onEnd() { isDragging = false; }

// Pinch zoom
let lastPinchDist = null;
function getPinchDist(touches) {
  const dx = touches[0].clientX - touches[1].clientX;
  const dy = touches[0].clientY - touches[1].clientY;
  return Math.sqrt(dx * dx + dy * dy);
}

renderer.domElement.addEventListener('mousedown', e => onStart(e.clientX, e.clientY));
renderer.domElement.addEventListener('mousemove', e => onMove(e.clientX, e.clientY));
renderer.domElement.addEventListener('mouseup', onEnd);

renderer.domElement.addEventListener('touchstart', e => {
  e.preventDefault();
  if (e.touches.length === 2) {
    isDragging = false;
    lastPinchDist = getPinchDist(e.touches);
  } else {
    lastPinchDist = null;
    onStart(e.touches[0].clientX, e.touches[0].clientY);
  }
}, { passive: false });

renderer.domElement.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length === 2) {
    const dist = getPinchDist(e.touches);
    if (lastPinchDist !== null) {
      const delta = lastPinchDist - dist;
      targetZ = Math.max(minZ, Math.min(maxZ, targetZ + delta * 0.05));
    }
    lastPinchDist = dist;
  } else {
    lastPinchDist = null;
    onMove(e.touches[0].clientX, e.touches[0].clientY);
  }
}, { passive: false });

renderer.domElement.addEventListener('touchend', e => {
  if (e.touches.length < 2) lastPinchDist = null;
  if (e.touches.length === 0) onEnd();
});

// Animation
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  camera.position.z += (targetZ - camera.position.z) * 0.08;
  group.rotation.x += (targetRotX - group.rotation.x) * 0.05;
  group.rotation.y += (targetRotY - group.rotation.y) * 0.05;

  // Auto-rotate slowly when not dragging
  if (!isDragging) {
    targetRotY += 0.003;
  }

  // Wave animation on each block
  group.children.forEach(mesh => {
    const d = mesh.userData.delay || 0;
    mesh.position.y = mesh.userData.baseY + Math.sin(t * 2 + d * 3) * 0.12;
    mesh.rotation.x = Math.sin(t * 1.5 + d * 2) * 0.1;
    mesh.rotation.z = Math.cos(t * 1.3 + d * 2.5) * 0.08;
  });

  // Lights orbit
  light1.position.x = Math.sin(t * 0.7) * 5;
  light1.position.z = Math.cos(t * 0.7) * 5;
  light2.position.x = Math.cos(t * 0.5) * 4;

  renderer.render(scene, camera);
}

animate();

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
